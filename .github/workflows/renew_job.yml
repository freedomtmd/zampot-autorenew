name: Zampto Renew

on:
  workflow_dispatch:
  schedule:
    - cron: '9 2 * * *'

jobs:
  run-zampto:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 检查 Secrets 是否设置
        run: |
          if [ -z "${{ secrets.ZAMPTO_USERNAME }}" ] || [ -z "${{ secrets.ZAMPTO_PASSWORD }}" ]; then
            echo "USERNAME or PASSWORD not set"
            exit 1
          fi
          echo "Account info is set"

      - name: 安装并启动 Xray
        env:
          VLESS_SERVER: ${{ secrets.VLESS_SERVER }}
          VLESS_UUID: ${{ secrets.VLESS_UUID }}
          VLESS_PUBKEY: ${{ secrets.VLESS_PUBKEY }}
          VLESS_SHORTID: ${{ secrets.VLESS_SHORTID }}
        run: |
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip -d xray-bin
          echo '{"log":{"loglevel":"warning"},"inbounds":[{"listen":"127.0.0.1","port":10808,"protocol":"socks","settings":{"udp":true}}],"outbounds":[{"protocol":"vless","settings":{"vnext":[{"address":"'"$VLESS_SERVER"'","port":443,"users":[{"id":"'"$VLESS_UUID"'","encryption":"none","flow":""}]}]},"streamSettings":{"network":"tcp","security":"reality","realitySettings":{"serverName":"www.icloud.com","fingerprint":"chrome","show":false,"publicKey":"'"$VLESS_PUBKEY"'","shortId":"'"$VLESS_SHORTID"'","spiderX":""}}}}]}' > xray-bin/config.json
          chmod +x xray-bin/xray
          nohup ./xray-bin/xray -config xray-bin/config.json > xray.log 2>&1 &
          sleep 5
          echo "=== Check Xray process ==="
          ps aux | grep xray | grep -v grep || echo "Xray not running"
          echo "=== Test proxy ==="
          curl --socks5-hostname 127.0.0.1:10808 -s --max-time 15 https://www.google.com -o /dev/null -w "HTTP: %{http_code}\n" || (echo "Proxy failed" && exit 1)
          echo "Xray proxy OK"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行续期脚本
        env:
          ZAMPTO_USER: ${{ secrets.ZAMPTO_USERNAME }}
          PASSWORD: ${{ secrets.ZAMPTO_PASSWORD }}
          SERVER_IDS: ${{ secrets.SERVER_IDS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_USERID: ${{ secrets.TG_USERID }}
          CHROME_PROXY: "socks5://127.0.0.1:10808"
        run: |
          echo "=== Check proxy before run ==="
          curl --socks5-hostname 127.0.0.1:10808 -s --max-time 10 https://www.google.com -o /dev/null || (echo "Proxy down, restart Xray..." && nohup ./xray-bin/xray -config xray-bin/config.json > xray2.log 2>&1 & sleep 3)
          python zampto_server.py -r 3

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 3
