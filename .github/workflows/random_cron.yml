name: Random Cron
on:
  workflow_run:
    workflows: ["Zampto Renew"]
    types:
      - completed

jobs:
  update-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT }}

    - name: Random Cron
      shell: bash
      run: |
        sed -i -E "s/(- cron: ')[0-9]+ [0-9]+( \* \* \*')/\1$(($RANDOM % 59)) $(($RANDOM % 23))\2/g" .github/workflows/renew_job.yml
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add .github/workflows/renew_job.yml
        git diff --cached --quiet && exit 0
        git commit -m "random cron"
        git push origin HEAD
